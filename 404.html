<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Síðan fannst ekki | VALTHR</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<style>
  @font-face{
    font-family:'Bebas Neue';
    font-style:normal;
    font-weight:400;
    font-display:swap;
    src:url('assets/fonts/bebas-neue-v16-latin-400.woff2') format('woff2');
  }
  @font-face{
    font-family:'Inter';
    font-style:normal;
    font-weight:400 700;
    font-display:swap;
    src:url('assets/fonts/inter-v20-latin-variable.woff2') format('woff2');
  }
  :root{
    --black:#0a0a0a;
    --white:#f5f5f5;
    --grey:#8a8a8a;
    --grey-line:#262626;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--black);color:var(--white);
    font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  h1,.btn{font-family:'Bebas Neue',sans-serif;letter-spacing:0.04em;}
  h1{font-size:clamp(56px,14vw,120px);line-height:0.9;text-transform:uppercase;color:var(--grey);margin-bottom:24px;}
  p{color:var(--grey);font-size:18px;line-height:1.6;max-width:420px;margin-bottom:36px;}
  .btn{
    display:inline-block;padding:16px 34px;font-size:18px;
    border:1px solid var(--white);color:var(--white);text-decoration:none;
    transition:all .25s ease;
  }
  .btn:hover{background:var(--white);color:var(--black);}
  .btn:focus-visible{outline:2px solid var(--white);outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>
  <h1>404</h1>
  <p>Úps. Þessi síða fannst ekki — kannski úr fókus, kannski aldrei til. Hún kemur allavega ekki aftur þó þú bíðir.</p>
  <a href="/" class="btn">Til baka á forsíðu</a>
</body>
</html>
